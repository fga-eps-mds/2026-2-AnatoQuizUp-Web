services:
  web:
    build:
      context: .
      args:
        # Embutidos no bundle em build time (Vite), por isso sao build args.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api/v1}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
    container_name: anatoquizup-web
    restart: unless-stopped
    environment:
      PORT: 8080
    ports:
      - "${WEB_PORT:-8080}:8080"
