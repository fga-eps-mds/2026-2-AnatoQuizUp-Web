name: Release - Frontend

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Adicionar código-fonte e testes à Release
    runs-on: ubuntu-latest

    steps:
      - name: Validar tag SemVer
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag inválida: $TAG"
            exit 1
          fi

      - name: Checkout da release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Compactar código-fonte e testes
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ARCHIVE="AnatoQuizUp-Front-${TAG}.zip"

          zip -r "$ARCHIVE" \
            src/ test/ \
            package.json package-lock.json \
            jest.config.cjs sonar-project.properties \
            tsconfig*.json \
            --exclude "*.DS_Store" \
                      "node_modules/*" \
                      "coverage/*" \
                      "dist/*" \
                      "build/*"

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Adicionar ZIP à GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" "$ARCHIVE" --clobber