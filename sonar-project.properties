sonar.projectKey=fga-eps-mds_2026-2-AnatoQuizUp-Web
sonar.organization=fga-eps-mds-1

# Código-fonte e testes
sonar.sources=src
sonar.tests=src,test

sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,**/*.spec.js,**/*.spec.jsx,**/*.spec.ts,**/*.spec.tsx

# Exclusões da análise de código-fonte
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/*.config.js,**/*.config.ts,**/*.test.*,**/*.spec.*,**/__mocks__/**,**/setupTests.*

# Relatório de cobertura do Jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Arquivos que não devem entrar no cálculo da cobertura
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/index.*,**/main.*,**/setupTests.*,**/*.config.*,**/shared/config/env.ts

sonar.sourceEncoding=UTF-8

# Relatório de execução dos testes, se estiver no formato genérico do Sonar
sonar.testExecutionReportPaths=sonar-report.xml